# Unchanged copy of ur_moveit_config (2.14.0) share/ur_moveit_config/config/kinematics.yaml.
# ur_moveit.launch.py loads this from moveit_config_package, which arm_control.launch.py sets to this package so
# MoveIt and Servo use srdf/amiga_ur_gripper.srdf.xacro. Keep it in sync with ur_moveit_config if that is updated.
/**:
  ros__parameters:
    robot_description_kinematics:
      ur_manipulator:
        kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
        kinematics_solver_search_resolution: 0.005
        kinematics_solver_timeout: 0.005
        kinematics_solver_attempts: 3
